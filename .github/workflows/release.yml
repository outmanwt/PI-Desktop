# Fork release pipeline.
#
# - Push vX.Y.Z: publish a versioned GitHub Release.
# - Push main: refresh the `nightly` GitHub Release automatically.
#
# This fork publishes Windows and Linux only. The application may still retain
# macOS source support, but macOS signing/build jobs are intentionally absent.
# The upstream release flow is retained for the shared build and verification
# contracts; this fork intentionally publishes only the supported fork targets.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_NIGHTLY: ${{ github.ref == 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - name: Typecheck Desktop
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Rust host-core test
        run: cargo test -p host-core --locked

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
            artifact: windows-x64
            platform: windows
            dist: dist:win
          - name: Linux x64
            os: ubuntu-22.04
            arch: x64
            artifact: linux-x64
            platform: linux
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            exit 1
          fi

      - name: Validate bundled models.dev catalog
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const path = 'apps/desktop/resources/models.dev/api.json';
          const catalog = JSON.parse(await readFile(path, 'utf8'));
          const valid = catalog && !Array.isArray(catalog) && typeof catalog === 'object' &&
            Object.values(catalog).some((provider) => provider && typeof provider === 'object' && provider.models);
          if (!valid) throw new Error(`${path} contains no provider model records`);
          console.log(`${path} is valid`);
          NODE

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare package inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      - name: Package Windows/Linux installer (${{ matrix.platform }})
        run: pnpm --filter @pi-desktop/desktop run ${{ matrix.dist }} -- --${{ matrix.arch }}

      - name: Verify Linux host-core glibc floor
        if: matrix.platform == 'linux'
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Export Linux ASAR release asset
        if: matrix.platform == 'linux'
        run: node scripts/export-linux-asar.mjs

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.asar
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  pi-host-bundle:
    name: Bundle pi-host (Linux x64)
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm build:js
          pnpm --filter '@pi-desktop/agent-runtime' bundle
          pnpm --filter '@pi-desktop/pi-host' build

          wait "$host_build_pid"
          trap - EXIT

      - name: Verify host-core glibc floor
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Assemble pi-host bundle
        run: node apps/pi-host/scripts/bundle.mjs --platform linux --arch x64

      - name: Archive bundle with checksum
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/pi-host/package.json').version")"
          name="pi-host-${VERSION}-linux-x64"
          out="apps/pi-host/dist-bundle"
          test -d "$out/$name"
          tar -czf "$out/${name}.tar.gz" -C "$out" "$name"
          ( cd "$out" && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          cat "$out/${name}.tar.gz.sha256"

      - name: Upload pi-host bundle
        uses: actions/upload-artifact@v7
        with:
          name: pi-host-linux-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/pi-host/dist-bundle/pi-host-*-linux-x64.tar.gz
            apps/pi-host/dist-bundle/pi-host-*-linux-x64.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build, pi-host-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Fork nightly releases use a stable tag and the current commit.
          tag_name: ${{ github.ref == 'refs/heads/main' && 'nightly' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # Windows/Linux installers, ZIPs, updater feeds, and pi-host are uploaded below.
          files: dist/*
          overwrite_files: true
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ github.ref == 'refs/heads/main' || contains(github.ref_name, '-') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
