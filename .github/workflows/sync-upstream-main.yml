# Keep this fork's main current with vastsa/PI-Desktop automatically.
# The workflow preserves fork commits, reapplies the fork-only update-feed
# override, and opens an Issue instead of silently dropping a merge conflict.

name: Sync upstream main

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main into fork main
    if: github.repository == 'outmanwt/PI-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git remotes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/vastsa/PI-Desktop.git
          git fetch --no-tags upstream main

      - name: Merge upstream main
        run: |
          set -euo pipefail
          conflict_title="Upstream sync conflict: ${GITHUB_REPOSITORY} main"
          open_conflict_issue() {
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $conflict_title" --json title --jq '.[].title' | grep -Fxq "$conflict_title"; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$conflict_title" \
                --body "Automatic upstream sync could not merge vastsa/PI-Desktop:main into main. Resolve the unexpected conflict in a branch, then close this issue." || true
            fi
          }

          if git merge --no-edit upstream/main; then
            echo "Upstream merge completed."
          else
            ours=(
              .github/workflows/release.yml
              .github/workflows/sync-upstream-main.yml
            )
            theirs=(
              README.md
              README.zh-CN.md
              Cargo.lock
              Cargo.toml
              apps/desktop/package.json
              apps/desktop/electron/main/updater.ts
              apps/desktop/resources/models.dev/api.json
              apps/desktop/test/auto-update.test.mjs
              apps/desktop/test/remote-host-bootstrap-script.test.mjs
              apps/desktop/test/remote-host-pi-host-release.test.mjs
              apps/desktop/test/remote-host-ssh-bootstrap.test.mjs
              apps/pi-host/package.json
              docs/package.json
              docs/project/unreleased.md
              docs/zh-CN/spec/06-delivery/04-e2e-test-plan.md
              package.json
              packages/agent-host/package.json
              packages/agent-runtime/package.json
              packages/host-runtime/package.json
              packages/i18n/package.json
              packages/plugin-devkit/package.json
              packages/plugin-sdk/package.json
              packages/racp/package.json
              packages/shared/package.json
              packages/shared/src/changelog-de.ts
              packages/shared/src/changelog-es.ts
              packages/shared/src/changelog-fr.ts
              packages/shared/src/changelog-ko.ts
              packages/shared/src/changelog-tr.ts
              packages/shared/src/changelog.test.ts
              packages/shared/src/changelog.ts
              packages/shared/src/github-feedback.test.ts
              packages/shared/src/github-feedback.ts
              packages/shared/src/protocol.ts
              pnpm-lock.yaml
              scripts/build-desktop-release.mjs
            )
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected=""
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              known=false
              for candidate in "${ours[@]}" "${theirs[@]}"; do
                [ "$path" = "$candidate" ] && known=true
              done
              [ "$known" = true ] || unexpected="${unexpected}\n${path}"
            done <<< "$conflicts"
            if [ -n "$unexpected" ]; then
              git merge --abort || true
              open_conflict_issue
              echo -e "::error::Unexpected upstream merge conflicts:${unexpected}"
              exit 1
            fi
            for path in "${ours[@]}"; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
                git checkout --ours -- "$path"
                git add -- "$path"
              fi
            done
            for path in "${theirs[@]}"; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
                git add -- "$path"
              fi
            done
            git commit --no-edit
            echo "Known fork/upstream conflicts were resolved automatically."
          fi

      - name: Reapply fork release-feed overrides
        run: node scripts/fork-overrides.mjs

      - name: Commit fork-only override changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Fork release-feed overrides already match."
          else
            git add -A -- apps/desktop/package.json apps/desktop/electron/main/updater.ts apps/desktop/test/auto-update.test.mjs packages/shared/src/github-feedback.ts packages/shared/src/github-feedback.test.ts packages/shared/src/protocol.ts apps/desktop/test/remote-host-pi-host-release.test.mjs apps/desktop/test/remote-host-ssh-bootstrap.test.mjs apps/desktop/test/remote-host-bootstrap-script.test.mjs README.md README.zh-CN.md scripts/fork-overrides.mjs
            git commit -m "chore(fork): preserve fork release feed"
          fi

      - name: Push synchronized main
        run: git push origin HEAD:main

      - name: Dispatch nightly release
        run: gh workflow run release.yml --repo ${{ github.repository }} --ref main
