# Keep this fork's `main` current with the upstream repository.
# GitHub's official merge-upstream endpoint performs the server-side merge,
# including workflow-file changes, without requiring a cross-fork PR or a
# workflow token with the special `workflows` permission.

name: Sync upstream main

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main into fork main
    if: github.repository != 'vastsa/PI-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data '{"branch":"main"}')"
          echo "$response"
          echo "Upstream merge request completed."